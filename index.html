<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#dff8ff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="傑尼龜合成">
<meta name="description" content="傑尼龜合成 · 純前端遊戲：拖動瞄準、放開投放，相同的撞在一起合成更大的一隻。">
<title>傑尼龜合成</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="app">

  <!-- ===== 遊戲區 ===== -->
  <section class="stage" id="stage">
    <canvas id="game" aria-label="傑尼龜合成遊戲區域"></canvas>

    <div class="revive-chip" id="reviveBadge" hidden>
      <span class="revive-chip-ico" aria-hidden="true">🪙</span><span id="reviveCount">×0</span>
    </div>

    <div class="overlay" id="overlay">
      <div class="dialog">

        <div class="revive-ask" id="revivePrompt" hidden>
          <div class="dialog-emoji">😵</div>
          <h2>還能再救一下</h2>
          <p class="dialog-score">本局得分 <strong id="reviveScore">0</strong></p>
          <p class="revive-hint">清掉警戒線以上的水果，接著玩</p>
          <div class="dialog-actions">
            <button class="btn" id="giveUpBtn" type="button">不了，結束吧</button>
            <button class="btn btn-revive" id="reviveBtn" type="button">🪙 用一枚復活幣</button>
          </div>
          <p class="dialog-hint" id="reviveLeft">還剩 1 枚</p>
        </div>

        <div id="overPanel">
          <div class="dialog-emoji">🌊</div>
          <h2 id="overTitle">遊戲結束</h2>
          <p class="dialog-score">本局得分 <strong id="finalScore">0</strong></p>
          <p class="dialog-best">最高分 <span id="finalBest">0</span></p>

          <div class="submit-box" id="submitBox">
            <p class="submit-msg" id="submitMsg">正在結算…</p>
            <p class="my-name">暱稱：<strong id="myNameLabel">預設使用者</strong>
              <button class="link-btn" id="editNameBtn" type="button">改暱稱</button>
            </p>
            <button class="btn" id="submitBtn" type="button" hidden>重試提交</button>
          </div>

          <div class="dialog-actions">
            <button class="btn" id="boardBtn2" type="button">🏆 排行榜</button>
            <button class="btn btn-primary" id="restartBtn" type="button">再來一局</button>
          </div>
          <p class="dialog-hint">按 R 鍵也可重新開始</p>
        </div>

      </div>
    </div>
  </section>

  <!-- ===== 側邊面板 ===== -->
  <aside class="panel">

    <header class="panel-head">
      <h1>傑尼龜合成</h1>
      <p class="subtitle">相同的撞在一起，越合越大</p>
    </header>

    <div class="stats">
      <div class="stat">
        <span class="stat-label">分數</span>
        <strong class="stat-value" id="score">0</strong>
      </div>
      <div class="stat">
        <span class="stat-label">最高分</span>
        <strong class="stat-value stat-best" id="best">0</strong>
      </div>
    </div>

    <div class="next-box">
      <span class="box-label">下一個</span>
      <canvas id="next" width="160" height="160" aria-label="下一個"></canvas>
    </div>

    <div class="chain-box">
      <span class="box-label">合成表</span>
      <canvas id="chain" width="680" height="112" aria-label="合成順序"></canvas>
      <p class="chain-note">✨ 兩個傑尼龜撞在一起會一起炸掉，換 <strong>500 分</strong> + <strong>一枚復活幣</strong></p>
    </div>

    <div class="actions">
      <button class="btn btn-wide" id="boardBtn" type="button">
        <span class="ico">🏆</span><span class="lbl">排行榜</span>
      </button>
      <button class="btn" id="soundBtn" type="button" aria-pressed="true">
        <span class="ico">🔊</span><span class="lbl">音效開</span>
      </button>
      <button class="btn btn-primary" id="resetBtn" type="button" title="重新開始">
        <span class="ico">↻</span><span class="lbl">重開</span>
      </button>
    </div>

    <p class="tips">
      滑鼠：移動瞄準、點擊投放；觸屏：拖動瞄準、放開投放。<br>
      ← → 微調位置，空白鍵投放，R 重開。<br>
      每 <strong>500 分</strong>攢一枚<strong>復活幣</strong>，僅在本局有效。
    </p>

  </aside>

</main>

<!-- ===== 排行榜彈窗 ===== -->
<div class="modal" id="boardModal" aria-hidden="true" role="dialog" aria-label="排行榜">
  <div class="modal-card">
    <header class="modal-head">
      <h2>🏆 最近高手榜</h2>
      <button class="icon-btn" id="boardClose" type="button" aria-label="關閉">✕</button>
    </header>
    <div class="nick-row">
      <label class="nick-label" for="nickInput">我的暱稱</label>
      <input class="nick-input" id="nickInput" type="text" maxlength="12"
             placeholder="預設使用者" autocomplete="nickname" enterkeyhint="done">
    </div>
    <div class="board-list" id="boardList"></div>
    <footer class="modal-foot">
      <span class="board-note">只取最近 20 次提交，成績會被之後的人擠下去</span>
      <button class="btn" id="boardRefresh" type="button">重新整理</button>
    </footer>
  </div>
</div>

<script src="parts.js"></script>
<script src="blur.js"></script>
<script src="game.js"></script>
<script src="leaderboard.min.js"></script>
</body>
</html>
